[project]
name = "schoolai"
version = "0.1.0"
description = "AI assistant for school teacher management"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    # Database (asyncpg para runtime async; psycopg2-binary solo en [dev] para alembic sync)
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    # Config
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # Telegram bot
    "python-telegram-bot[job-queue]>=21.0,<22.0",
    # HTTP
    "httpx>=0.28.0,<1.0.0",
    # Event loop (Linux/macOS)
    "uvloop>=0.22.1,<1.0.0; sys_platform != 'win32'",
    # Cache / estado persistente (opcional — degradado a RAM si no hay servidor Redis)
    "redis>=5.0.0,<6.0.0",
    # Logging
    "loguru>=0.7.0,<1.0.0",
    "groq>=1.1.1,<2.0.0",
    "openai>=2.28.0,<3.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "bcrypt>=4.0.0,<5.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "docxtpl>=0.20.2,<1.0.0",
    "fpdf2>=2.8.7,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "ddgs>=9.13.1",
    "rapidfuzz>=3.0,<4.0",
    "apscheduler>=3.10,<4.0",
    "rich>=13.0,<14.0",
    "questionary>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "psycopg2-binary>=2.9.10",  # solo para migraciones alembic sync en dev
]

[project.entry-points."schoolai.skills"]
attendance      = "schoolai.skills.attendance.skill:AttendanceSkill"
attendance_edit = "schoolai.skills.attendance.skill:AttendanceEditSkill"
hw_edit      = "schoolai.skills.homework.skill:HWEditSkill"
hw_report    = "schoolai.skills.homework.skill:HWReportSkill"
homework     = "schoolai.skills.homework.skill:HomeworkSkill"
query        = "schoolai.skills.query.skill:QuerySkill"
cuotas       = "schoolai.skills.cuotas.skill:CuotaSkill"
orchestrator = "schoolai.skills.orchestrator.skill:OrchestratorSkill"
chat         = "schoolai.skills.ia.skill:ChatSkill"

[project.entry-points."schoolai.channels"]
telegram  = "schoolai.bot.channels.telegram:TelegramChannel"
whatsapp  = "schoolai.bot.channels.whatsapp:WhatsAppChannel"

[project.scripts]
schoolai-bot         = "schoolai.bot.main:run"
schoolai-bot-jornada = "schoolai.bot.main_dev:run_dev"
schoolai-bot-agente  = "schoolai.bot.main_agente:run_agente"
schoolai-dev        = "schoolai.bot.dev:run"
schoolaiapi         = "schoolai.api.runner:run"
schoolai            = "schoolai.cli.dispatcher:main"
schoolai-cli        = "schoolai.cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/schoolai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pylint>=4.0.5",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
