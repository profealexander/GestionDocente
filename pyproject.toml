[project]
name = "schoolai"
version = "0.1.0"
description = "AI assistant for school teacher management"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    # Config
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    # Telegram bot
    "python-telegram-bot[job-queue]>=21.0",
    # AI
    "zhipuai>=2.1.0",
    # HTTP
    "httpx>=0.28.0",
    # Event loop (Linux/macOS)
    "uvloop>=0.22.1; sys_platform != 'win32'",
    # Cache / estado persistente (opcional — degradado a RAM si no hay servidor Redis)
    "redis>=5.0.0",
    # Logging
    "loguru>=0.7.0",
    "groq>=1.1.1",
    "openai>=2.28.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-docx>=1.2.0",
    "docxtpl>=0.20.2",
    "fpdf2>=2.8.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
schoolai-bot     = "schoolai.bot.main:run"
schoolai-bot-dev = "schoolai.bot.main_dev:run_dev"
schoolai-dev     = "schoolai.bot.dev:run"
schoolai-api     = "schoolai.api.runner:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/schoolai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
